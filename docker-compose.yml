# Database PostgreSQL per lo sviluppo locale:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: omnia_marina
      POSTGRES_PASSWORD: omnia_marina
      POSTGRES_DB: omnia_marina
    ports:
      - "5432:5432"
    volumes:
      - omnia-marina-db:/var/lib/postgresql/data

volumes:
  omnia-marina-db:
